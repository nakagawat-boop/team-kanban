<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>チームカンバン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f11;
  --surface: #18181c;
  --surface2: #202026;
  --border: rgba(255,255,255,0.07);
  --border-hover: rgba(255,255,255,0.14);
  --text: #f0f0f2;
  --text-muted: #7a7a88;
  --text-dim: #44444f;
  --accent: #7c6af7;
  --accent-soft: rgba(124,106,247,0.12);

  --todo-color: #8888a0;
  --prog-color: #7aaaf7;
  --review-color: #d49af5;
  --done-color: #5dd49a;

  --high-bg: rgba(240,80,80,0.1); --high: #f08080;
  --short-bg: rgba(240,130,60,0.1); --short: #f0a060;
  --long-bg: rgba(100,140,240,0.1); --long: #88aaee;

  --team-bg: rgba(124,106,247,0.12); --team: #a89cf7;
  --personal-bg: rgba(74,180,180,0.1); --personal: #5dd4d4;

  --stale-border: #d4843a;
  --stale-bg: rgba(212,132,58,0.07);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none; z-index: 0;
}
.app { position: relative; z-index: 1; }

header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 15px 22px;
  border-bottom: 1px solid var(--border);
  background: rgba(15,15,17,0.92);
  backdrop-filter: blur(12px);
  position: sticky; top: 0; z-index: 100;
  flex-wrap: wrap; gap: 10px;
}
.logo {
  display: flex; align-items: center; gap: 10px;
  font-size: 15px; font-weight: 500;
}
.logo-mark {
  width: 28px; height: 28px; background: var(--accent);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
}
.logo-mark svg { width: 14px; height: 14px; fill: white; }
.header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'DM Sans', sans-serif; font-size: 13px;
  padding: 6px 13px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-muted); cursor: pointer; transition: all 0.14s; white-space: nowrap;
}
.btn:hover { border-color: var(--border-hover); color: var(--text); }
.btn.primary { background: var(--accent); border-color: transparent; color: white; }
.btn.primary:hover { background: #9180f9; }
.btn svg { width: 13px; height: 13px; }

.select-pill {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px;
  padding: 6px 12px; border-radius: 999px; cursor: pointer; outline: none;
}
.select-pill option { background: #1a1a1f; }

.toolbar {
  padding: 9px 22px; display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap; border-bottom: 1px solid var(--border);
}
.search-wrap { position: relative; flex: 1; min-width: 160px; max-width: 240px; }
.search-wrap svg {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  width: 13px; height: 13px; color: var(--text-dim); pointer-events: none;
}
.search-wrap input {
  width: 100%; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-family: 'DM Sans', sans-serif;
  font-size: 13px; padding: 6px 10px 6px 29px; outline: none;
}
.search-wrap input::placeholder { color: var(--text-dim); }
.search-wrap input:focus { border-color: var(--accent); }
.fg { display: flex; align-items: center; gap: 5px; }
.fl { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
.fs {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  font-family: 'DM Sans', sans-serif; font-size: 12px; padding: 5px 8px;
  border-radius: 7px; cursor: pointer; outline: none;
}
.fs option { background: #1a1a1f; }

.stats {
  display: flex; gap: 1px; padding: 0 22px;
  border-bottom: 1px solid var(--border); overflow-x: auto;
}
.stat { padding: 9px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 100px; }
.stat-n { font-size: 19px; font-weight: 500; font-family: 'DM Mono', monospace; }
.stat-l { font-size: 11px; color: var(--text-muted); }
.stat-sep { width: 1px; background: var(--border); margin: 8px 0; }

.stale-note {
  padding: 6px 22px; font-size: 11px; color: var(--stale-border);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 6px;
}
.stale-dot { width: 8px; height: 8px; border-radius: 2px; border: 1.5px solid var(--stale-border); flex-shrink: 0; }

.board-wrap { overflow: auto; padding: 16px 22px 40px; }

.board-grid {
  display: grid;
  min-width: max-content;
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}

.corner-cell {
  background: var(--surface);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; left: 0; z-index: 20;
}

.col-head {
  display: flex; align-items: center; gap: 9px;
  padding: 0 14px; height: 54px;
  background: var(--surface);
  border-left: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 10;
  user-select: none;
}
.col-drag-handle {
  display: flex; flex-direction: column; gap: 2.5px;
  cursor: grab; padding: 4px 2px; flex-shrink: 0; opacity: 0.3;
  transition: opacity 0.13s;
}
.col-drag-handle:hover { opacity: 0.8; }
.col-drag-handle span {
  display: block; width: 12px; height: 1.5px;
  background: var(--text); border-radius: 1px;
}
.col-head.col-dragging { opacity: 0.4; }
.col-head.col-drag-over { border-left: 2px solid var(--accent); background: rgba(124,106,247,0.06); }
.col-head-name { font-size: 13px; font-weight: 500; color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.col-head-count {
  font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-dim);
  background: var(--surface2); padding: 2px 7px; border-radius: 999px; flex-shrink: 0;
}
.del-member-btn {
  width: 22px; height: 22px; border-radius: 50%;
  border: 1px solid transparent; background: transparent;
  color: var(--text-dim); cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.13s; margin-left: 2px;
}
.del-member-btn:hover { border-color: rgba(240,80,80,0.4); color: var(--high); background: rgba(240,80,80,0.08); }

.member-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--accent-soft); border: 1px solid rgba(124,106,247,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 500; color: var(--accent); flex-shrink: 0;
}
.all-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--surface2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}

.row-label {
  display: flex; align-items: center; justify-content: center;
  padding: 10px 6px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  position: sticky; left: 0; z-index: 5;
  min-width: 54px;
  overflow: hidden;
}
.row-label:last-of-type { border-bottom: none; }
.row-label-inner {
  display: flex; align-items: center; gap: 6px;
  transform: rotate(-90deg);
  white-space: nowrap;
}
.row-label-text {
  font-size: 11px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase;
}
.row-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

.drop-cell {
  min-height: 140px;
  padding: 8px;
  border-left: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 5px;
  transition: background 0.13s;
  overflow: hidden;
  min-width: 0;
  max-width: 240px;
  width: 100%;
}
.drop-cell:last-child { border-bottom: none; }
.drop-cell.drag-over { background: rgba(124,106,247,0.07); }

.card {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 9px; padding: 9px 11px;
  cursor: grab; user-select: none;
  transition: border-color 0.14s, background 0.14s;
  animation: fadeUp 0.16s ease both;
  flex-shrink: 0;
  position: relative;
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
  box-sizing: border-box;
}
.card:hover .card-actions { opacity: 1; }
.card-actions {
  position: absolute; top: 6px; right: 6px;
  display: flex; gap: 3px;
  opacity: 0; transition: opacity 0.13s;
}
.card-action-btn {
  width: 22px; height: 22px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-dim); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.12s; flex-shrink: 0;
}
.card-action-btn:hover { border-color: var(--border-hover); color: var(--text); background: var(--surface2); }
.card-action-btn.del:hover { border-color: rgba(240,80,80,0.4); color: var(--high); background: rgba(240,80,80,0.08); }
.card-action-btn svg { width: 10px; height: 10px; pointer-events: none; }
@keyframes fadeUp { from { opacity:0; transform:translateY(3px); } to { opacity:1; transform:none; } }
.card:hover { border-color: var(--border-hover); background: rgba(255,255,255,0.06); }
.card.dragging { opacity: 0.28; cursor: grabbing; }
.card.expanded { border-color: var(--accent) !important; }
.card.stale { border-color: var(--stale-border); background: var(--stale-bg); }

.card-title { font-size: 12px; font-weight: 500; color: var(--text); line-height: 1.4; margin-bottom: 6px; word-break: break-word; }
.card-meta { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }

.pill {
  font-size: 9px; padding: 2px 6px; border-radius: 999px; font-weight: 500; white-space: nowrap;
}
.pill.short { background: var(--short-bg); color: var(--short); }
.pill.long  { background: var(--long-bg);  color: var(--long); }
.pill.team { background: var(--team-bg); color: var(--team); }
.pill.personal { background: var(--personal-bg); color: var(--personal); }
.pill.requester { background: rgba(180,140,80,0.12); color: #d4aa60; }
.pill.stale-pill { background: rgba(212,132,58,0.14); color: var(--stale-border); }

.due-tag { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text-muted); }
.due-tag.overdue { color: var(--high); }

.card-detail {
  margin-top: 7px; padding-top: 7px;
  border-top: 1px solid var(--border);
  font-size: 11px; color: var(--text-muted); line-height: 18px;
  word-break: break-word; overflow-wrap: break-word;
  overflow: hidden;
  max-height: 2000px;
  transition: max-height 0.3s ease;
  white-space: pre-wrap;
}
.card-detail.collapsed {
  max-height: 18px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.notes-toggle {
  display: inline-block; margin-top: 3px;
  font-size: 10px; color: var(--accent); cursor: pointer;
  background: none; border: none; padding: 0;
  font-family: 'DM Sans', sans-serif;
}
.notes-toggle:hover { text-decoration: underline; }
.card-detail-preview {
  margin-top: 7px; padding-top: 7px;
  border-top: 1px solid var(--border);
  font-size: 11px; color: var(--text-muted); line-height: 18px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.move-row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 7px; }
.move-btn {
  font-size: 10px; padding: 3px 7px; border-radius: 5px;
  border: 1px solid var(--border); background: transparent;
  color: var(--text-muted); cursor: pointer; font-family: 'DM Sans', sans-serif;
  transition: all 0.12s;
}
.move-btn:hover { border-color: var(--border-hover); color: var(--text); background: var(--surface2); }

.cell-empty { font-size: 11px; color: var(--text-dim); text-align: center; padding: 16px 0; }

.add-in-cell {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; color: var(--text-dim); cursor: pointer;
  padding: 4px 6px; border-radius: 6px; transition: all 0.12s;
  border: 1px dashed transparent; flex-shrink: 0;
}
.add-in-cell:hover { color: var(--text-muted); border-color: var(--border); background: rgba(255,255,255,0.025); }
.add-in-cell svg { width: 11px; height: 11px; flex-shrink: 0; }

.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.65); backdrop-filter: blur(4px);
  z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.hidden { display: none; }
.modal {
  background: var(--surface); border: 1px solid var(--border-hover);
  border-radius: 16px; width: 100%; max-width: 440px; padding: 22px;
  animation: slideUp 0.17s ease;
}
@keyframes slideUp { from { transform: translateY(8px); opacity:0; } to { transform:none; opacity:1; } }
.modal h2 { font-size: 15px; font-weight: 500; margin-bottom: 16px; }
.field { margin-bottom: 11px; }
.field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
.field input, .field select, .field textarea {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-family: 'DM Sans', sans-serif;
  font-size: 13px; padding: 7px 10px; outline: none; resize: vertical;
  transition: border-color 0.13s;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field input::placeholder, .field textarea::placeholder { color: var(--text-dim); }
.field select option { background: #1a1a1f; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

.toast {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(50px);
  background: var(--surface2); border: 1px solid var(--border-hover);
  border-radius: 999px; padding: 8px 16px; font-size: 13px; color: var(--text);
  z-index: 300; transition: transform 0.2s ease; white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }
</style>
</head>
<body>

<!-- ── ログイン画面 ── -->
<div id="login-screen" style="display:flex;align-items:center;justify-content:center;min-height:100vh;position:relative;z-index:1;">
  <div style="background:var(--surface);border:1px solid var(--border-hover);border-radius:20px;padding:48px 40px;text-align:center;max-width:380px;width:100%;">
    <div style="width:48px;height:48px;background:var(--accent);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
      <svg width="24" height="24" viewBox="0 0 14 14" fill="white"><rect x="0" y="0" width="6" height="6" rx="1"/><rect x="8" y="0" width="6" height="6" rx="1"/><rect x="0" y="8" width="6" height="6" rx="1"/><rect x="8" y="8" width="6" height="3" rx="1"/></svg>
    </div>
    <h1 style="font-size:20px;font-weight:500;margin-bottom:8px;color:var(--text)">チームカンバン</h1>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:32px;line-height:1.6">Googleアカウントでログインして<br>チームのタスクを管理しましょう</p>
    <div id="login-error" style="display:none;background:rgba(240,80,80,0.1);color:#f08080;border-radius:8px;padding:10px 14px;font-size:12px;margin-bottom:16px;line-height:1.6;"></div>
    <button onclick="loginWithGoogle()" style="display:inline-flex;align-items:center;gap:10px;background:white;color:#333;border:none;border-radius:10px;padding:12px 24px;font-size:14px;font-weight:500;cursor:pointer;width:100%;justify-content:center;transition:opacity 0.15s;" onmouseover="this.style.opacity=0.9" onmouseout="this.style.opacity=1">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Googleでログイン
    </button>
  </div>
</div>

<!-- ── メインアプリ ── -->
<div id="app" style="display:none;">

<header>
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 14 14"><rect x="0" y="0" width="6" height="6" rx="1"/><rect x="8" y="0" width="6" height="6" rx="1"/><rect x="0" y="8" width="6" height="6" rx="1"/><rect x="8" y="8" width="6" height="3" rx="1"/></svg>
    </div>
    チームカンバン
  </div>
  <div class="header-right">
    <button class="btn" onclick="addMember()">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="5" cy="4" r="2.5"/><path d="M1 12c0-2.2 1.8-4 4-4s4 1.8 4 4"/><line x1="11" y1="7" x2="11" y2="13"/><line x1="8" y1="10" x2="14" y2="10"/></svg>
      メンバー追加
    </button>
    <button class="btn primary" onclick="openModal()">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><line x1="7" y1="1" x2="7" y2="13"/><line x1="1" y1="7" x2="13" y2="7"/></svg>
      タスク追加
    </button>
    <button class="btn" onclick="exportData()">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 10v2h10v-2M7 1v7M4 5l3 3 3-3"/></svg>
      CSV
    </button>
    <div style="display:flex;align-items:center;gap:8px;padding-left:8px;border-left:1px solid var(--border);">
      <div id="user-avatar" style="width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:white;flex-shrink:0;"></div>
      <span id="user-name" style="font-size:12px;color:var(--text-muted);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
      <button class="btn" onclick="logout()" style="padding:4px 10px;font-size:12px;">ログアウト</button>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="6" r="4"/><line x1="9.5" y1="9.5" x2="13" y2="13"/></svg>
    <input type="text" id="search" placeholder="タスクを検索..." oninput="render()">
  </div>
  <div class="fg">
    <span class="fl">種別</span>
    <select class="fs" id="type-filter" onchange="render()">
      <option value="">すべて</option>
      <option value="team">チーム施策</option>
      <option value="personal">個人施策</option>
    </select>
  </div>
  <div class="fg">
    <span class="fl">期間</span>
    <select class="fs" id="pri-filter" onchange="render()">
      <option value="">すべて</option>
      <option value="short">短期</option>
      <option value="long">長期</option>
    </select>
  </div>
  <div class="fg">
    <span class="fl">期限</span>
    <select class="fs" id="due-filter" onchange="render()">
      <option value="">すべて</option>
      <option value="overdue">期限超過</option>
      <option value="today">本日</option>
      <option value="week">今週</option>
    </select>
  </div>
</div>

<div class="stats" id="stats"></div>

<div class="stale-note">
  <div class="stale-dot"></div>
  3日間更新がないタスクはオレンジ枠で表示されます
</div>

<div class="board-wrap">
  <div id="board" class="board-grid"></div>
</div>

<!-- Modal -->
<div class="modal-overlay hidden" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2 id="modal-title">タスクを追加</h2>
    <div class="field">
      <label>タスク名 *</label>
      <input type="text" id="m-name" placeholder="タスク名...">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="field">
        <label>担当者</label>
        <select id="m-assignee"></select>
      </div>
      <div class="field">
        <label>依頼者（任意）</label>
        <select id="m-requester"></select>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="field">
        <label>種別</label>
        <select id="m-type">
          <option value="team">チーム施策</option>
          <option value="personal">個人施策</option>
        </select>
      </div>
      <div class="field">
        <label>期間</label>
        <select id="m-priority">
          <option value="short">短期</option>
          <option value="long">長期</option>
        </select>
      </div>
      <div class="field">
        <label>ステータス</label>
        <select id="m-status">
          <option value="active">タスク一覧</option>
          <option value="done">完了</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>期限</label>
      <input type="date" id="m-due">
    </div>
    <div class="field">
      <label>メモ</label>
      <textarea id="m-notes" rows="2" placeholder="詳細..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn primary" onclick="saveTask()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

</div><!-- /#app -->

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, onValue, set, remove, update } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyCPTyzVSJxXcEPe2D_iKv7ne_STypt1F4E",
  authDomain: "team-kanban-22d3c.firebaseapp.com",
  databaseURL: "https://team-kanban-22d3c-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "team-kanban-22d3c",
  storageBucket: "team-kanban-22d3c.firebasestorage.app",
  messagingSenderId: "454258236875",
  appId: "1:454258236875:web:2358c8b866b3b938596a4e"
};

const app  = initializeApp(firebaseConfig);
const db   = getDatabase(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const ALLOWED_DOMAIN = 'meiko-career.jp';

onAuthStateChanged(auth, user => {
  if (user) {
    const email = user.email || '';
    if (!email.endsWith('@' + ALLOWED_DOMAIN)) {
      signOut(auth);
      document.getElementById('login-error').style.display = 'block';
      document.getElementById('login-error').textContent = `⚠ ${email} はアクセスが許可されていません。@${ALLOWED_DOMAIN} のアカウントでログインしてください。`;
      return;
    }
    document.getElementById('login-error').style.display = 'none';
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('user-name').textContent = user.displayName || email;
    document.getElementById('user-avatar').textContent = (user.displayName||email||'?')[0].toUpperCase();
    maybeInitData();
    subscribeFirebase();
  } else {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
});

window.loginWithGoogle = async function() {
  try { await signInWithPopup(auth, provider); }
  catch(e) { alert('ログインに失敗しました: ' + e.message); }
};
window.logout = async function() {
  if (!confirm('ログアウトしますか？')) return;
  await signOut(auth);
};

const ROWS = [
  { id:'active', label:'タスク一覧', color:'var(--prog-color)' },
  { id:'done',   label:'完了',       color:'var(--done-color)' }
];

let tasks=[], members=[], expandedId=null, editId=null;
window._dragId = null;
window._colDragId = null;
const today = new Date(); today.setHours(0,0,0,0);
const endOfWeek = new Date(today); endOfWeek.setDate(today.getDate()+7);
const STALE_MS      = 3*24*60*60*1000;
const AUTO_DELETE_MS= 2*24*60*60*1000;

function saveTasks()   { set(ref(db,'tasks'), Object.fromEntries(tasks.map(t=>[t.id,t]))); }
function saveMembers() { set(ref(db,'members'), members); }

function autoDeleteDone() {
  const before = tasks.length;
  tasks = tasks.filter(t => {
    if (t.status !== 'done') return true;
    if (!t.completedAt) { t.completedAt = t.updatedAt||Date.now(); return true; }
    return (Date.now() - t.completedAt) < AUTO_DELETE_MS;
  });
  if (tasks.length !== before) saveTasks();
}

function subscribeFirebase() {
  onValue(ref(db,'tasks'), snap => {
    const val = snap.val()||{};
    tasks = Object.values(val);
    autoDeleteDone();
    render();
  });
  onValue(ref(db,'members'), snap => {
    const val = snap.val();
    members = Array.isArray(val) ? val : (val ? Object.values(val) : ['中村','喜多','小谷','大城']);
    render();
  });
}

function maybeInitData() {
  const initRef = ref(db,'initialized');
  onValue(initRef, snap => {
    if (snap.val()) return;
    const now = Date.now();
    const initTasks = [
      { id:'t1', name:'ユーザーインタビュー設計', assignee:null,   type:'team',     priority:'short', status:'active', due:'2026-04-10', notes:'5名を予定',      updatedAt:now },
      { id:'t2', name:'UIプロトタイプ作成',       assignee:'喜多', type:'personal', priority:'short', status:'active', due:'2026-04-05', notes:'Figmaで作成',    updatedAt:now-4*24*60*60*1000 },
      { id:'t3', name:'APIエンドポイント設計',     assignee:null,   type:'team',     priority:'long',  status:'active', due:'2026-04-08', notes:'RESTful設計',    updatedAt:now },
      { id:'t4', name:'テスト計画書作成',          assignee:'中村', type:'personal', priority:'long',  status:'active', due:'2026-04-20', notes:'',              updatedAt:now-5*24*60*60*1000 },
      { id:'t6', name:'CI/CD設定',                assignee:'大城', type:'personal', priority:'short', status:'active', due:'2026-04-03', notes:'GitHub Actions', updatedAt:now-3*24*60*60*1000 },
    ];
    set(ref(db,'tasks'),    Object.fromEntries(initTasks.map(t=>[t.id,t])));
    set(ref(db,'members'),  ['中村','喜多','小谷','大城']);
    set(ref(db,'initialized'), true);
  }, { onlyOnce: true });
}

function getPid() { return 'p1'; }
function isStale(t)   { if(t.status==='done')return false; return (Date.now()-(t.updatedAt||Date.now()))>=STALE_MS; }
function isOverdue(t) { return t.due && new Date(t.due)<today && t.status!=='done'; }

function getFiltered() {
  const q    = document.getElementById('search').value.toLowerCase();
  const type = document.getElementById('type-filter').value;
  const pri  = document.getElementById('pri-filter').value;
  const due  = document.getElementById('due-filter').value;
  return tasks.filter(t => {
    if (q    && !t.name.toLowerCase().includes(q)) return false;
    if (type && t.type !== type) return false;
    if (pri  && t.priority !== pri) return false;
    if (due === 'overdue' && !isOverdue(t)) return false;
    if (due === 'today'   && t.due !== today.toISOString().split('T')[0]) return false;
    if (due === 'week'    && (!t.due||new Date(t.due)<today||new Date(t.due)>endOfWeek)) return false;
    return true;
  });
}

function render() {
  const filtered = getFiltered();
  renderStats(filtered);

  const projMembers = [...new Set(tasks.map(t=>t.assignee).filter(Boolean))];
  members.forEach(m => { if (!projMembers.includes(m)) projMembers.push(m); });

  const cols = [
    { id:'__all__', name:'全体', isAll:true },
    ...projMembers.map(n=>({ id:n, name:n, isAll:false }))
  ];

  const board = document.getElementById('board');
  board.style.gridTemplateColumns = `54px repeat(${cols.length}, minmax(0, 240px))`;

  let html = '';
  html += `<div class="corner-cell" style="height:54px;"></div>`;
  cols.forEach((col) => {
    const colTasks = filtered.filter(t => col.isAll ? !t.assignee : t.assignee===col.id);
    const av = col.isAll
      ? `<div class="all-avatar"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="var(--text-muted)" stroke-width="1.5"><circle cx="5" cy="4" r="2.5"/><path d="M1 12c0-2.2 1.8-4 4-4s4 1.8 4 4"/><circle cx="11" cy="5" r="2"/><path d="M13 12c0-1.7-1.3-3-3-3"/></svg></div>`
      : `<div class="member-avatar">${initials(col.name)}</div>`;
    const delBtn = col.isAll ? '' : `<button class="del-member-btn" title="メンバーを削除" onclick="deleteMember('${col.name.replace(/'/g,"\\'")}')"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="1" y1="1" x2="11" y2="11"/><line x1="11" y1="1" x2="1" y2="11"/></svg></button>`;
    const dragHandle = col.isAll ? '' : `<div class="col-drag-handle" title="ドラッグして移動"><span></span><span></span><span></span></div>`;
    const dataCol = col.isAll ? '' : `data-col="${escHtml(col.id)}"`;
    html += `<div class="col-head" ${dataCol}>${dragHandle}${av}<span class="col-head-name">${escHtml(col.name)}</span><span class="col-head-count">${colTasks.length}</span>${delBtn}</div>`;
  });

  ROWS.forEach(row => {
    html += `<div class="row-label">
      <div class="row-label-inner">
        <div class="row-dot" style="background:${row.color}"></div>
        <span class="row-label-text" style="color:${row.color}">${row.label}</span>
      </div>
    </div>`;

    cols.forEach(col => {
      const cellTasks = filtered.filter(t =>
        t.status === row.id && (col.isAll ? !t.assignee : t.assignee===col.id)
      );
      const cellId = `cell-${row.id}-${safeId(col.id)}`;
      const assigneeArg = col.isAll ? '' : escHtml(col.id);
      html += `<div class="drop-cell" id="${cellId}"
        ondragover="onCellDragOver(event,'${cellId}')"
        ondragleave="document.getElementById('${cellId}').classList.remove('drag-over')"
        ondrop="onCellDrop(event,'${cellId}','${row.id}','${assigneeArg.replace(/'/g,"\\'")}')">
        ${cellTasks.length ? cellTasks.map(t=>cardHTML(t)).join('') : '<div class="cell-empty">—</div>'}
        <div class="add-in-cell" onclick="openModal('${row.id}','${assigneeArg.replace(/'/g,"\\'")}')">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="6" y1="1" x2="6" y2="11"/><line x1="1" y1="6" x2="11" y2="6"/></svg>追加
        </div>
      </div>`;
    });
  });

  board.innerHTML = html;

  // カードのドラッグ
  board.querySelectorAll('.card').forEach(c => {
    c.addEventListener('dragstart', e => {
      if (window._colDragId) { e.preventDefault(); return; }
      window._dragId = c.dataset.id;
      c.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    c.addEventListener('dragend', () => {
      c.classList.remove('dragging');
      window._dragId = null;
      board.querySelectorAll('.drop-cell').forEach(el => el.classList.remove('drag-over'));
    });
  });

  // 列ヘッダーのドラッグ
  board.querySelectorAll('.col-head[data-col]').forEach(h => {
    const handle = h.querySelector('.col-drag-handle');
    if (!handle) return;
    handle.addEventListener('mousedown', e => {
      e.stopPropagation();
      h.setAttribute('draggable', 'true');
    });
    document.addEventListener('mouseup', () => {
      h.setAttribute('draggable', 'false');
    });
    h.addEventListener('dragstart', e => {
      if (h.getAttribute('draggable') !== 'true') { e.preventDefault(); return; }
      window._colDragId = h.dataset.col;
      window._dragId = null;
      h.classList.add('col-dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    h.addEventListener('dragend', () => {
      h.classList.remove('col-dragging');
      h.setAttribute('draggable', 'false');
      window._colDragId = null;
      board.querySelectorAll('.col-head').forEach(el => el.classList.remove('col-drag-over'));
    });
    h.addEventListener('dragover', e => {
      if (!window._colDragId || window._colDragId === h.dataset.col) return;
      e.preventDefault();
      board.querySelectorAll('.col-head').forEach(el => el.classList.remove('col-drag-over'));
      h.classList.add('col-drag-over');
    });
    h.addEventListener('dragleave', () => h.classList.remove('col-drag-over'));
    h.addEventListener('drop', e => {
      e.preventDefault();
      h.classList.remove('col-drag-over');
      if (!window._colDragId || window._colDragId === h.dataset.col) return;
      const from = members.indexOf(window._colDragId);
      const to   = members.indexOf(h.dataset.col);
      if (from === -1 || to === -1) return;
      members.splice(to, 0, members.splice(from, 1)[0]);
      saveMembers();
      render();
      toast('列を移動しました');
    });
  });
}

function notesHTML(id, notes) {
  const isLong = notes.includes('\n') || notes.length > 40;
  if (!isLong) return `<div class="card-detail">${escHtml(notes)}</div>`;
  const firstLine = escHtml(notes.split('\n')[0].slice(0, 60)) + (notes.length > 60 ? '…' : '');
  return `<div class="card-detail" id="note-${id}" style="display:none">${escHtml(notes)}</div>
<div class="card-detail-preview" id="preview-${id}">${firstLine}</div>
<button class="notes-toggle" onclick="event.stopPropagation();toggleNote('${id}')">▼ もっと見る</button>`;
}

function cardHTML(t) {
  const over=isOverdue(t), stale=isStale(t);
  const termL = t.priority==='short' ? '短期' : '長期';
  return `<div class="card${stale?' stale':''}" draggable="true" data-id="${t.id}">
    <div class="card-actions">
      <button class="card-action-btn" title="編集" onclick="event.stopPropagation();editTask('${t.id}')"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2l2 2-6 6H2V8z"/></svg></button>
      <button class="card-action-btn del" title="削除" onclick="event.stopPropagation();deleteTask('${t.id}')"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="1" y1="1" x2="11" y2="11"/><line x1="11" y1="1" x2="1" y2="11"/></svg></button>
    </div>
    <div class="card-title" style="padding-right:50px">${escHtml(t.name)}</div>
    <div class="card-meta">
      <span class="pill ${t.type}">${t.type==='team'?'チーム':'個人'}</span>
      <span class="pill ${t.priority||'long'}">${termL}</span>
      ${t.requester?`<span class="pill requester">${escHtml(t.requester)}から</span>`:''}
      ${t.due?`<span class="due-tag${over?' overdue':''}">${over?'⚠ ':''}${t.due}</span>`:''}
      ${stale?`<span class="pill stale-pill">3日放置</span>`:''}
    </div>
    ${t.notes ? notesHTML(t.id, t.notes) : ''}
  </div>`;
}

function renderStats(filtered) {
  const total=filtered.length, active=filtered.filter(t=>t.status==='active').length;
  const short=filtered.filter(t=>t.priority==='short'&&t.status!=='done').length;
  const done=filtered.filter(t=>t.status==='done').length;
  const over=filtered.filter(t=>isOverdue(t)).length, stale=filtered.filter(t=>isStale(t)).length;
  document.getElementById('stats').innerHTML = [
    [total,'総タスク','var(--text)'],[active,'タスク一覧','var(--prog-color)'],
    [short,'短期','var(--short)'],[done,'完了','var(--done-color)'],
    [over,'期限超過','var(--high)'],[stale,'放置中','var(--stale-border)']
  ].map((s,i)=>`${i?'<div class="stat-sep"></div>':''}<div class="stat"><div class="stat-n" style="color:${s[2]}">${s[0]}</div><div class="stat-l">${s[1]}</div></div>`).join('');
}

window.onCellDragOver = function(e, cellId) {
  if (window._colDragId) return;
  e.preventDefault();
  document.getElementById(cellId)?.classList.add('drag-over');
};

window.onCellDrop = function(e, cellId, newStatus) {
  if (window._colDragId) return;
  e.preventDefault();
  document.getElementById(cellId)?.classList.remove('drag-over');
  if (!window._dragId) return;
  const t = tasks.find(x=>x.id===window._dragId);
  if (!t) return;
  t.status = newStatus;
  t.updatedAt = Date.now();
  if (newStatus==='done' && !t.completedAt) t.completedAt = Date.now();
  update(ref(db,`tasks/${t.id}`), t);
  toast(ROWS.find(r=>r.id===newStatus)?.label+' に移動しました');
};

function syncAssigneeSelect() {
  const names=[...new Set([...members,...tasks.map(t=>t.assignee).filter(Boolean)])];
  const sel=document.getElementById('m-assignee'), req=document.getElementById('m-requester');
  if(!sel||!req) return;
  const curA=sel.value, curR=req.value;
  const opts='<option value="">（未割当）</option><option value="__all__">全員</option>'+names.map(n=>`<option value="${n}">${escHtml(n)}</option>`).join('');
  sel.innerHTML=opts; req.innerHTML='<option value="">（なし）</option>'+names.map(n=>`<option value="${n}">${escHtml(n)}</option>`).join('');
  if(curA) sel.value=curA; if(curR) req.value=curR;
}

window.openModal = function(status, assignee) {
  editId=null;
  document.getElementById('modal-title').textContent='タスクを追加';
  document.getElementById('m-name').value='';
  document.getElementById('m-priority').value='short';
  document.getElementById('m-status').value=status||'active';
  document.getElementById('m-type').value='team';
  document.getElementById('m-due').value='';
  document.getElementById('m-notes').value='';
  syncAssigneeSelect();
  if(assignee) document.getElementById('m-assignee').value=assignee;
  document.getElementById('m-requester').value='';
  document.getElementById('modal-overlay').classList.remove('hidden');
  setTimeout(()=>document.getElementById('m-name').focus(),40);
};

window.editTask = function(id) {
  const t=tasks.find(x=>x.id===id); if(!t) return;
  editId=id;
  document.getElementById('modal-title').textContent='タスクを編集';
  document.getElementById('m-name').value=t.name;
  document.getElementById('m-priority').value=t.priority;
  document.getElementById('m-status').value=t.status;
  document.getElementById('m-type').value=t.type||'team';
  document.getElementById('m-due').value=t.due||'';
  document.getElementById('m-notes').value=t.notes||'';
  syncAssigneeSelect();
  document.getElementById('m-assignee').value=t.assignee||'';
  document.getElementById('m-requester').value=t.requester||'';
  document.getElementById('modal-overlay').classList.remove('hidden');
};

window.closeModal = function() { document.getElementById('modal-overlay').classList.add('hidden'); editId=null; };

window.saveTask = function() {
  const name=document.getElementById('m-name').value.trim();
  if(!name){ document.getElementById('m-name').focus(); return; }
  const ts=Date.now();
  const assigneeVal=document.getElementById('m-assignee').value;
  const baseData = {
    name,
    requester: document.getElementById('m-requester').value||null,
    type:      document.getElementById('m-type').value,
    priority:  document.getElementById('m-priority').value,
    status:    document.getElementById('m-status').value,
    due:       document.getElementById('m-due').value||null,
    notes:     document.getElementById('m-notes').value.trim(),
    updatedAt: ts
  };
  if (editId) {
    const t = tasks.find(x=>x.id===editId);
    if (t) {
      const updated = { ...t, ...baseData,
        assignee: assigneeVal==='__all__' ? t.assignee : (assigneeVal||null),
        completedAt: t.completedAt||null
      };
      set(ref(db,`tasks/${editId}`), updated);
    }
    closeModal();
    toast('タスクを更新しました');
    return;
  }
  if (assigneeVal === '__all__') {
    const targets = [...members];
    targets.forEach((m, i) => {
      const id = 't'+(ts+i);
      const t = { id, assignee:m, ...baseData };
      if (t.status==='done') t.completedAt=ts;
      set(ref(db,`tasks/${id}`), t);
    });
    closeModal();
    toast(`全員（${targets.length}名）にタスクを作成しました`);
    return;
  }
  const assignee = assigneeVal||null;
  const id = 't'+ts;
  const t = { id, assignee, ...baseData };
  if (t.status==='done') t.completedAt=ts;
  set(ref(db,`tasks/${id}`), t);
  if(assignee&&!members.includes(assignee)){ members.push(assignee); saveMembers(); }
  closeModal();
  toast('タスクを追加しました');
};

window.deleteTask = function(id) {
  if(!confirm('このタスクを削除しますか？')) return;
  remove(ref(db,`tasks/${id}`));
  toast('削除しました');
};

window.deleteMember = function(name) {
  const hasTasks=tasks.some(t=>t.assignee===name);
  if(hasTasks){
    if(!confirm(`「${name}」を削除すると、担当タスクが未割当になります。よろしいですか？`)) return;
    tasks.filter(t=>t.assignee===name).forEach(t=>{ update(ref(db,`tasks/${t.id}`),{assignee:null,updatedAt:Date.now()}); });
  } else {
    if(!confirm(`「${name}」をメンバーから削除しますか？`)) return;
  }
  members=members.filter(m=>m!==name); saveMembers();
  toast(`${name} を削除しました`);
};

window.addMember = function() {
  const name=prompt('メンバー名を入力:');
  if(!name?.trim()) return;
  const n=name.trim();
  if(!members.includes(n)){ members.push(n); saveMembers(); }
  toast(n+' を追加しました');
};

window.exportData = function() {
  const lines=[['タスク名','担当者','依頼者','種別','期間','ステータス','期限','メモ'].join(',')];
  tasks.forEach(t=>lines.push([`"${t.name}"`,t.assignee||'',t.requester||'',t.type||'',t.priority,t.status,t.due||'',`"${t.notes||''}"`].join(',')));
  const blob=new Blob(['\uFEFF'+lines.join('\n')],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='kanban_tasks.csv'; a.click();
  toast('CSVをエクスポートしました');
};

window.toggleNote = function(id) {
  const detail  = document.getElementById('note-'+id);
  const preview = document.getElementById('preview-'+id);
  const btn     = preview?.nextElementSibling || detail?.nextElementSibling;
  if (!detail) return;
  const opening = detail.style.display === 'none';
  detail.style.display = opening ? 'block' : 'none';
  if (preview) preview.style.display = opening ? 'none' : 'block';
  if (btn?.classList.contains('notes-toggle')) btn.textContent = opening ? '▲ 折りたたむ' : '▼ もっと見る';
};

function initials(n){ return (n||'?').split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2); }
function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function safeId(s)  { return (s||'x').replace(/[^a-zA-Z0-9]/g,'_'); }

let _tt;
window.toast = function(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove('show'),2000);
};
function toast(msg){ window.toast(msg); }

document.addEventListener('keydown', e => {
  if(e.key==='Escape'){ closeModal(); render(); }
  if(e.key==='Enter'&&!e.target.matches('textarea')&&!document.getElementById('modal-overlay').classList.contains('hidden')) saveTask();
});

setInterval(()=>{ autoDeleteDone(); }, 60*60*1000);
</script>
